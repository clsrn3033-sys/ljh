image boot.vfat {
    vfat {
        extraargs = "-F 32"
        files = {
            "bcm2711-rpi-4-b.dtb",
            "rpi-firmware/cmdline.txt",
            "rpi-firmware/config.txt",
            "rpi-firmware/fixup4.dat",
            "rpi-firmware/overlays",
            "rpi-firmware/start4.elf",
            "Image",
        }
    }
    size = 96M
}

image sdcard.img {
    hdimage {
    }
    partition boot {
        offset = 1M
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
